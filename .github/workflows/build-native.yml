name: Build native bridge

# Builds reparos_bridge (CTranslate2 + SentencePiece, linked statically) for each
# platform, runs the Go test suite against it, and attaches the libraries to a
# GitHub Release when a version tag (v*) is pushed.

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'bridge/**'
      - 'native.go'
      - '.github/workflows/build-native.yml'

env:
  CT2_VERSION: v4.8.2
  SP_VERSION: v0.2.2

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-22.04     # old glibc keeps the .so portable
            lib: reparos_bridge.so
          - platform: windows-amd64
            os: windows-latest
            lib: reparos_bridge.dll
          # macOS legs are experimental: a failure must not block the Linux/Windows
          # Release. Drop `experimental` once they build and test cleanly.
          - platform: darwin-arm64
            os: macos-15
            lib: reparos_bridge.dylib
            osx_arch: arm64
            experimental: true
          - platform: darwin-amd64
            os: macos-15-intel
            lib: reparos_bridge.dylib
            osx_arch: x86_64
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Fetch CTranslate2 and SentencePiece sources
        shell: bash
        run: |
          git clone --depth 1 --branch "$CT2_VERSION" --recursive --shallow-submodules https://github.com/OpenNMT/CTranslate2.git third_party/CTranslate2
          git clone --depth 1 --branch "$SP_VERSION" https://github.com/google/sentencepiece.git third_party/sentencepiece

      - name: Configure
        shell: bash
        env:
          OSX_ARCH: ${{ matrix.osx_arch }}
        run: |
          args=(-S bridge -B build -DCT2_SOURCE_DIR="$PWD/third_party/CTranslate2" -DSP_SOURCE_DIR="$PWD/third_party/sentencepiece" -DCMAKE_POLICY_VERSION_MINIMUM=3.5)
          if [ "$RUNNER_OS" = "Windows" ]; then args+=(-A x64); else args+=(-DCMAKE_BUILD_TYPE=Release); fi
          # Without this the dylib would require the runner's macOS version (15).
          if [ "$RUNNER_OS" = "macOS" ]; then args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH"); fi
          cmake "${args[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Collect library
        shell: bash
        env:
          LIB: ${{ matrix.lib }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          f=$(find build -name "$LIB" | head -n 1)
          test -n "$f"
          ext="${LIB##*.}"
          cp "$f" "dist/reparos_bridge-$PLATFORM.$ext"
          cp "$f" "dist/$LIB"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "reparos_bridge-$PLATFORM.$ext" > "SHA256SUMS-$PLATFORM.txt"
          else
            shasum -a 256 "reparos_bridge-$PLATFORM.$ext" > "SHA256SUMS-$PLATFORM.txt"
          fi
          ls -l

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go tests against the native library
        shell: bash
        env:
          REPAROS_NATIVE_LIB: ${{ github.workspace }}/dist/${{ matrix.lib }}
        run: go test -count=1 -v ./...

      - uses: actions/upload-artifact@v4
        with:
          name: reparos_bridge-${{ matrix.platform }}
          path: |
            dist/reparos_bridge-${{ matrix.platform }}.*
            dist/SHA256SUMS-${{ matrix.platform }}.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
