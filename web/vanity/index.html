<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>ReparoS-Go: Vietnamese Query Understanding & Spell Correction</title>

  <!-- 
    CẤU HÌNH VANITY IMPORT PATH CHO GO:
    Thay thế 'yourdomain.com' bằng tên miền riêng của bạn (hoặc username.github.io)
    Thay thế 'YOUR_USERNAME' bằng username GitHub của bạn
  -->
  <meta name="go-import" content="yourdomain.com/reparos git https://github.com/YOUR_USERNAME/reparos-go">
  <meta name="go-source" content="yourdomain.com/reparos https://github.com/YOUR_USERNAME/reparos-go https://github.com/YOUR_USERNAME/reparos-go/tree/main{/dir} https://github.com/YOUR_USERNAME/reparos-go/blob/main{/dir}/{file}#L{line}">

  <!-- Tự động chuyển hướng người dùng khi mở trên trình duyệt về GitHub repo -->
  <meta http-equiv="refresh" content="0; url=https://github.com/YOUR_USERNAME/reparos-go">
</head>
<body>
  <p>Đang chuyển hướng tới repository trên GitHub: <a href="https://github.com/YOUR_USERNAME/reparos-go">https://github.com/YOUR_USERNAME/reparos-go</a>...</p>
</body>
</html>
